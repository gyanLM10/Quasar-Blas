[package]
name = "quasar-blas"
version = "0.1.0"
edition = "2024"
description = "A high-performance CPU linear algebra engine exploring cache tiling and portable SIMD for dense matrix multiplication (GEMM)."
license = "MIT"
rust-version = "1.94"

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
ndarray = "0.16"
approx = "0.5"
tokio = { version = "1.0", features = ["full"] }
clickhouse = { version = "0.11", default-features = false }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "cpu_gemm"
harness = false

[[example]]
name = "db_integration"
required-features = ["std"]
