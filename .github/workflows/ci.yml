name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-host:
    name: Test Host (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Run tests (CPU + GPU + Embedded features)
        run: cargo test --features "gpu,embedded"

  cross-compile-embedded:
    name: Build Embedded (no_std)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Verify no_std constraints (Cross Compile)
        run: cross build --target thumbv7em-none-eabihf --features embedded --no-default-features --lib
